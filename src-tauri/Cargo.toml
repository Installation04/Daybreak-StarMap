[package]
name = "daybreak-star-map"
version = "0.27.0"
description = "Daybreak Star Map: a GPU-accelerated star map of the Project Daybreak universe"
authors = ["Faber"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "daybreak_star_map_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
